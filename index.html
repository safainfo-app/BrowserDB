<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>BrowserDB — semplice DB offline</title>
	<link rel="stylesheet" href="./styles.css" />
</head>
<body>
	<header>
		<h1>BrowserDB</h1>
		<div class="controls">
			<button id="btn-new-db">Nuovo DB</button>
			<input id="file-import" type="file" accept=".sqlite" style="display:none" />
			<button id="btn-import">Importa .sqlite</button>
			<button id="btn-export">Esporta .sqlite</button>
		</div>
	</header>

	<main>
		<section id="left">
			<h2>Schema</h2>
			<div id="tables-list"></div>

			<h3>Crea tabella</h3>
			<form id="table-builder-form">
				<label>
					Nome tabella
					<input id="table-name" placeholder="nome_tabella" required />
				</label>

				<div id="columns-list" aria-live="polite">
					<!-- righe colonne (nome, tipo, PK) generate dinamicamente -->
				</div>

				<div class="builder-actions">
					<button type="button" id="btn-add-column">+ Aggiungi colonna</button>
					<button type="submit" id="btn-create-table">Crea tabella</button>

					<!-- editing indicator & actions -->
					<span id="edit-indicator" style="display:none">Editing: <strong id="editing-name"></strong></span>
					<button type="button" id="btn-cancel-edit" style="display:none">Annulla modifica</button>
					<button type="button" id="btn-drop-table" style="display:none">Elimina tabella</button>
				</div>

				<h3>Relate tables</h3>
				<form id="relate-form">
					<label>
						Tabella sorgente
						<select id="rel-src-table"></select>
					</label>
					<label>
						Nome colonna (in sorgente)
						<input id="rel-src-col" placeholder="fk_col" />
					</label>
					<label>
						Tipo
						<select id="rel-type">
							<option>INTEGER</option>
							<option>TEXT</option>
							<option>REAL</option>
							<option>BLOB</option>
						</select>
					</label>
					<label>
						Tabella target
						<select id="rel-target-table"></select>
					</label>
					<label>
						Colonna target
						<select id="rel-target-col"></select>
					</label>
					<div class="builder-actions">
						<button type="button" id="btn-add-relation">Aggiungi relazione</button>
					</div>
				</form>

				<h4>Log</h4>
				<pre id="sql-output" aria-live="polite"></pre>
			</form>
		</section>
	</main>

	<footer>
		<small>Interfaccia grafica per creare e relazionare tabelle. Il DB in memoria viene perso al refresh a meno che non si esporti.</small>
	</footer>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
	<script type="module" src="./main.js"></script>
</body>
</html>
